<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARServer Wiki — Documentation Preview</title>
  <meta name="description" content="ARServer product wiki with clean Markdown preview for quick start, troubleshooting, validation, roadmap, and deployment documentation." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://masarray.github.io/arserver/wiki.html" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" type="image/png" sizes="256x256" href="assets/arserver-icon.png" />
  <link rel="apple-touch-icon" href="assets/arserver-icon.png" />
  <meta name="theme-color" content="#eff6ff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Sometype+Mono:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="markdown-preview.css" />
  <link rel="stylesheet" href="wiki-typography.css" />
</head>
<body>
  <a class="skip-link" href="#article">Skip to document</a>

  <header class="wiki-header">
    <a class="wiki-brand" href="./" aria-label="Back to ARServer landing page">
      <span><img src="assets/arserver-icon.png" alt="" /></span>
      <strong>ARServer <small>Product Wiki</small></strong>
    </a>
    <nav aria-label="Wiki navigation">
      <a href="./">Landing</a>
      <a href="https://github.com/masarray/arserver">GitHub</a>
    </nav>
  </header>

  <main class="wiki-shell">
    <aside class="wiki-sidebar" aria-label="Documentation list">
      <p class="sidebar-kicker">Documentation</p>
      <a data-doc="QUICK_START.md" href="wiki.html?doc=QUICK_START.md">Quick Start</a>
      <a data-doc="TROUBLESHOOTING.md" href="wiki.html?doc=TROUBLESHOOTING.md">Troubleshooting</a>
      <a data-doc="VALIDATION_MATRIX.md" href="wiki.html?doc=VALIDATION_MATRIX.md">Validation Matrix</a>
      <a data-doc="ROADMAP.md" href="wiki.html?doc=ROADMAP.md">Roadmap</a>
      <a data-doc="DEPLOYMENT.md" href="wiki.html?doc=DEPLOYMENT.md">Deployment</a>
      <hr />
      <a href="https://github.com/masarray/arserver/security/policy">Security Policy</a>
    </aside>

    <section class="wiki-document-frame">
      <div class="doc-toolbar">
        <div>
          <span class="doc-eyebrow">Markdown preview</span>
          <h1 id="doc-title">Loading documentation…</h1>
        </div>
        <div class="doc-actions">
          <a id="raw-link" href="#" rel="noreferrer">Open raw</a>
          <a id="repo-link" href="https://github.com/masarray/arserver/tree/main/docs" rel="noreferrer">Docs folder</a>
        </div>
      </div>

      <article id="article" class="markdown-body" aria-live="polite">
        <div class="loading-card">
          <span></span>
          <p>Rendering Markdown preview…</p>
        </div>
      </article>
    </section>
  </main>

  <script src="markdown-preview.js" defer></script>
</body>
</html>
