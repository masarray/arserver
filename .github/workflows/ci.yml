name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ARIEC61850 engine
        uses: actions/checkout@v4
        with:
          repository: masarray/ARIEC61850
          path: .deps/ARIEC61850

      - name: Link ARIEC61850 project reference
        shell: pwsh
        run: |
          $target = (Resolve-Path ".deps/ARIEC61850").Path
          $link = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "ARIEC61850"
          if (Test-Path $link) {
            Remove-Item $link -Recurse -Force
          }
          New-Item -ItemType Junction -Path $link -Target $target | Out-Null

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ARServer.sln

      - name: Build
        run: dotnet build ARServer.sln --configuration Release --no-restore

      - name: Run repository tests when test projects exist
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $excludedRoots = @(
            (Join-Path $workspace '.deps'),
            (Join-Path $workspace 'bin'),
            (Join-Path $workspace 'obj')
          )

          $testProjects = Get-ChildItem -Path $workspace -Recurse -Filter *.csproj -File |
            Where-Object {
              $fullName = $_.FullName
              $isExcluded = $false
              foreach ($root in $excludedRoots) {
                if ($fullName.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)) {
                  $isExcluded = $true
                  break
                }
              }

              (-not $isExcluded) -and (
                $_.BaseName -match '(?i)(^|[._-])(test|tests)([._-]|$)' -or
                $_.DirectoryName -match '(?i)(^|[\\/])(test|tests)([\\/]|$)'
              )
            }

          if (-not $testProjects) {
            Write-Host "No ARServer-owned test projects found. Dependency tests are validated in their owning repository."
            return
          }

          foreach ($project in $testProjects) {
            Write-Host "Testing $($project.FullName)"
            dotnet test $project.FullName --configuration Release --verbosity normal
            if ($LASTEXITCODE -ne 0) {
              throw "Test project failed: $($project.FullName)"
            }
          }
